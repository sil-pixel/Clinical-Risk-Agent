<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.h1{font-size:34px;font-weight:700;fill:#0f172a}.sub{font-size:17px;fill:#475569}.t{font-size:17px;font-weight:700}.d{font-size:14px;fill:#334155}.g{font-size:15px;font-weight:700}.a{font-size:13px;fill:#475569;font-style:italic}.b{font-size:21px;font-weight:700;fill:#7c2d12}</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="2000" height="1000" fill="#ffffff"/><text x="40" y="58" class="h1">Bodhica — Evidence Ingestion Flow</text><text x="40" y="88" class="sub">Offline build of the research corpus and Qdrant index; abstracts only, no PDF text is indexed</text><rect x="40" y="130" width="1920" height="190" rx="16" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="58" y="116" width="161.6" height="28" rx="14" fill="#ffffff" stroke="#475569"/><text x="70" y="135" class="g" fill="#0f172a">Source selection</text><rect x="64" y="160" width="270" height="132" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/><text x="78" y="187" class="t" fill="#1e3a8a">Research PDFs</text><text x="78" y="210" class="d">data/Research Papers/</text><text x="78" y="229" class="d">supplied by the researcher</text><text x="78" y="248" class="d">identification only</text><rect x="374" y="160" width="270" height="132" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="388" y="187" class="t" fill="#312e81">PDF discovery</text><text x="388" y="210" class="d">rag_discover_pdfs.py</text><text x="388" y="229" class="d">pypdf: DOI from page 1</text><text x="388" y="248" class="d">no text indexed</text><rect x="684" y="160" width="270" height="132" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="698" y="187" class="t" fill="#831843">NCBI ESearch</text><text x="698" y="210" class="d">E-utilities API</text><text x="698" y="229" class="d">DOI → PubMed ID</text><text x="698" y="248" class="d">via curl</text><rect x="994" y="160" width="270" height="132" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1008" y="187" class="t" fill="#7c2d12">Approved manifest</text><text x="1008" y="210" class="d">21 PMIDs + topics</text><text x="1008" y="229" class="d">quality appraisals</text><text x="1008" y="248" class="d">reviewer + date</text><rect x="1304" y="160" width="270" height="132" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1318" y="187" class="t" fill="#7c2d12">Claim catalog</text><text x="1318" y="210" class="d">curated claim support</text><text x="1318" y="229" class="d">hash-locked to corpus</text><text x="1318" y="248" class="d">gold benchmark sets</text><polyline points="334,226.0 370,226.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="644,226.0 680,226.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="954,226.0 990,226.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1264,226.0 1300,226.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="380" width="1920" height="370" rx="16" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="260" y="366" width="135.8" height="28" rx="14" fill="#ffffff" stroke="#475569"/><text x="272" y="385" class="g" fill="#0f172a">rag_ingest.py</text><rect x="64" y="410" width="270" height="132" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="78" y="437" class="t" fill="#831843">NCBI EFetch</text><text x="78" y="460" class="d">E-utilities, XML</text><text x="78" y="479" class="d">PubmedArticle records</text><text x="78" y="498" class="d">retraction metadata</text><rect x="374" y="410" width="270" height="132" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="388" y="437" class="t" fill="#312e81">XML parsing</text><text x="388" y="460" class="d">xml.etree.ElementTree</text><text x="388" y="479" class="d">title, authors, DOI, date</text><text x="388" y="498" class="d">labelled abstract sections</text><rect x="684" y="410" width="270" height="132" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="698" y="437" class="t" fill="#7c2d12">Admission checks</text><text x="698" y="460" class="d">approved + appraisal passed</text><text x="698" y="479" class="d">not retracted</text><text x="698" y="498" class="d">retraction check ≤ 14 days</text><rect x="994" y="410" width="270" height="132" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="1008" y="437" class="t" fill="#134e4a">Chunking</text><text x="1008" y="460" class="d">document: 1 per abstract</text><text x="1008" y="479" class="d">hierarchical: ≤ 300 tokens,</text><text x="1008" y="498" class="d">~30 overlap, sentence cuts</text><rect x="1304" y="410" width="270" height="132" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="1318" y="437" class="t" fill="#134e4a">Token counting</text><text x="1318" y="460" class="d">MedCPT article</text><text x="1318" y="479" class="d">tokenizer (Hugging Face)</text><text x="1318" y="498" class="d">512-token limit</text><polyline points="1069,292 1069,340 199,340 199,406" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="334,476.0 370,476.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="644,476.0 680,476.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="954,476.0 990,476.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1264,476.0 1300,476.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="374" y="590" width="270" height="132" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="388" y="617" class="t" fill="#134e4a">Dense embeddings</text><text x="388" y="640" class="d">MedCPT Article Encoder</text><text x="388" y="659" class="d">CLS pooling, 768-d</text><text x="388" y="678" class="d">title + text pairs</text><rect x="684" y="590" width="270" height="132" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="698" y="617" class="t" fill="#134e4a">Sparse BM25</text><text x="698" y="640" class="d">local BM25 index</text><text x="698" y="659" class="d">k1 = 1.2, b = 0.75</text><text x="698" y="678" class="d">Qdrant sparse vectors</text><rect x="994" y="590" width="270" height="132" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="1008" y="617" class="t" fill="#831843">Qdrant collections</text><text x="1008" y="640" class="d">qdrant-client, embedded</text><text x="1008" y="659" class="d">document: 21 passages</text><text x="1008" y="678" class="d">hierarchical: 39 passages</text><rect x="1304" y="590" width="270" height="132" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1318" y="617" class="t" fill="#7c2d12">Corpus manifest</text><text x="1318" y="640" class="d">rag_corpus_manifest.json</text><text x="1318" y="659" class="d">encoder SHA-256 pins</text><text x="1318" y="678" class="d">immutable versions</text><polyline points="1439,542 1439,566 509,566 509,586" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="644,656.0 680,656.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="954,656.0 990,656.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1264,656.0 1300,656.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1640" y="470" width="296" height="180" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="1654" y="497" class="t" fill="#312e81">Runtime use</text><text x="1654" y="520" class="d">ResearchRuntime loads the</text><text x="1654" y="539" class="d">hierarchical collection,</text><text x="1654" y="558" class="d">MedCPT Query Encoder and</text><text x="1654" y="577" class="d">claim catalog; refuses on</text><text x="1654" y="596" class="d">hash or freshness mismatch</text><polyline points="1574,656 1610,656 1610,560 1636,560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1574,226 1788,226 1788,466" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><text x="1687.0" y="219.0" class="a">claims</text><rect x="40" y="790" width="1920" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="54" y="817" class="t" fill="#1e293b">Evaluation</text><text x="54" y="840" class="d">rag_general_benchmark.py on 19 gold questions: Recall@5 1.0, nDCG@5 0.95 (hierarchical) · cross-encoder rerankers (MedCPT, MiniLM) benchmarked and rejected</text><text x="54" y="859" class="d">Shipped to Modal: data/indexes/models, qdrant/ and the corpus manifest (deployment/modal_app.py)</text><rect x="40" y="900" width="1920" height="56" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="1000.0" y="936.0" class="b" text-anchor="middle">Only PubMed abstracts from approved, appraised, non-retracted sources are indexed.</text></svg>