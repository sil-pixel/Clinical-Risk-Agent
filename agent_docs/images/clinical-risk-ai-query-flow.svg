<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.h1{font-size:34px;font-weight:700;fill:#0f172a}.sub{font-size:17px;fill:#475569}.t{font-size:17px;font-weight:700}.d{font-size:14px;fill:#334155}.g{font-size:15px;font-weight:700}.a{font-size:13px;fill:#475569;font-style:italic}.b{font-size:21px;font-weight:700;fill:#7c2d12}</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="2000" height="1320" fill="#ffffff"/><text x="40" y="58" class="h1">Bodhica — Query Flow</text><text x="40" y="88" class="sub">Runtime path of a chat message or questionnaire submission, with the models and libraries used at each step</text><rect x="40" y="130" width="250" height="112" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/><text x="54" y="157" class="t" fill="#1e3a8a">Chat UI</text><text x="54" y="180" class="d">React 19 + Vite</text><text x="54" y="199" class="d">hosted on Vercel</text><text x="54" y="218" class="d">SSE stream client</text><rect x="330" y="130" width="250" height="112" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="344" y="157" class="t" fill="#312e81">FastAPI API</text><text x="344" y="180" class="d">Modal (CPU, ap-south)</text><text x="344" y="199" class="d">POST /v1/messages:stream</text><text x="344" y="218" class="d">memory-only bearer session</text><rect x="620" y="130" width="250" height="112" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="634" y="157" class="t" fill="#7c2d12">Crisis fast path</text><text x="634" y="180" class="d">deterministic safety rules</text><text x="634" y="199" class="d">skips capacity + quota</text><text x="634" y="218" class="d">fixed crisis reply</text><rect x="910" y="130" width="250" height="112" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="924" y="157" class="t" fill="#312e81">Fixed-reply cache</text><text x="924" y="180" class="d">SHA-256 of message (no text)</text><text x="924" y="199" class="d">LRU, 2,048 entries</text><text x="924" y="218" class="d">hit → cached reply</text><rect x="1200" y="130" width="250" height="112" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="1214" y="157" class="t" fill="#312e81">Capacity + quotas</text><text x="1214" y="180" class="d">≤ 8 concurrent model ops</text><text x="1214" y="199" class="d">per-session chat quota</text><text x="1214" y="218" class="d">busy → 503 retryable</text><polyline points="290,186.0 326,186.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="580,186.0 616,186.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="870,186.0 906,186.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1160,186.0 1196,186.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="300" width="1920" height="160" rx="16" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="300" y="286" width="454.0" height="28" rx="14" fill="#ffffff" stroke="#475569"/><text x="312" y="305" class="g" fill="#0f172a">LangGraph RoutingGraph (one-turn, no checkpointer)</text><rect x="64" y="328" width="244" height="104" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="355" class="t" fill="#0f172a">Validate</text><text x="78" y="378" class="d">session + deployment</text><text x="78" y="397" class="d">mode</text><rect x="336" y="328" width="244" height="104" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="350" y="355" class="t" fill="#7c2d12">Safety port</text><text x="350" y="378" class="d">crisis, minor, diagnosis,</text><text x="350" y="397" class="d">medication phrase rules</text><rect x="608" y="328" width="244" height="104" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="622" y="355" class="t" fill="#0f172a">Language gate</text><text x="622" y="378" class="d">English (ASCII) only</text><rect x="880" y="328" width="244" height="104" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="894" y="355" class="t" fill="#0f172a">Certain rules</text><text x="894" y="378" class="d">curated questions,</text><text x="894" y="397" class="d">explicit phrases</text><rect x="1152" y="328" width="244" height="104" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="1166" y="355" class="t" fill="#134e4a">Semantic router</text><text x="1166" y="378" class="d">bge-small-en-v1.5</text><text x="1166" y="397" class="d">top-3 cosine, T-scaled</text><rect x="1424" y="328" width="244" height="104" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1438" y="355" class="t" fill="#7c2d12">Prompt Guard 2</text><text x="1438" y="378" class="d">Llama-Prompt-Guard-2-86M</text><text x="1438" y="397" class="d">LLM-bound / unfamiliar</text><rect x="1696" y="328" width="244" height="104" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1710" y="355" class="t" fill="#0f172a">Select route</text><text x="1710" y="378" class="d">confidence ≥ 0.85</text><text x="1710" y="397" class="d">else clarify</text><polyline points="308,380.0 332,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="580,380.0 604,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="852,380.0 876,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1124,380.0 1148,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1396,380.0 1420,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1668,380.0 1692,380.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1325,242 1325,280 176,280 176,324" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="500" width="1690" height="630" rx="16" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="58" y="486" width="454.0" height="28" rx="14" fill="#ffffff" stroke="#475569"/><text x="70" y="505" class="g" fill="#0f172a">Workflows (chat routes + questionnaire submission)</text><rect x="64" y="526" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="553" class="t" fill="#0f172a">Research /</text><text x="78" y="576" class="d">scientific + education</text><rect x="284" y="526" width="196" height="100" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="298" y="553" class="t" fill="#134e4a">MedCPT Query</text><text x="298" y="576" class="d">Encoder (CLS, 768-d)</text><text x="298" y="595" class="d">local, checksum-pinned</text><polyline points="254,576.0 280,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="498" y="526" width="196" height="100" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="512" y="553" class="t" fill="#831843">Qdrant hybrid</text><text x="512" y="576" class="d">dense cosine &gt; 0.85</text><text x="512" y="595" class="d">+ BM25 sparse, RRF k=60</text><polyline points="480,576.0 494,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="712" y="526" width="196" height="100" rx="12" fill="#e6f6f4" stroke="#0f766e" stroke-width="2"/><text x="726" y="553" class="t" fill="#134e4a">Claim support</text><text x="726" y="576" class="d">curated claims, then</text><text x="726" y="595" class="d">general evidence</text><polyline points="694,576.0 708,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="926" y="526" width="196" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="940" y="553" class="t" fill="#312e81">Curated cache</text><text x="940" y="576" class="d">verified wording reused;</text><text x="940" y="595" class="d">miss → Gemini</text><polyline points="908,576.0 922,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1140" y="526" width="196" height="100" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="1154" y="553" class="t" fill="#4c1d95">Gemini 3.5</text><text x="1154" y="576" class="d">Flash-Lite, structured</text><text x="1154" y="595" class="d">JSON output</text><polyline points="1122,576.0 1136,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1354" y="526" width="196" height="100" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1368" y="553" class="t" fill="#7c2d12">Validation</text><text x="1368" y="576" class="d">exact approved wording,</text><text x="1368" y="595" class="d">allowed citation IDs</text><polyline points="1336,576.0 1350,576.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="64" y="766" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="793" class="t" fill="#0f172a">Explain my result</text><text x="78" y="816" class="d">session result</text><rect x="284" y="766" width="196" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="298" y="793" class="t" fill="#312e81">Cached result</text><text x="298" y="816" class="d">validated scores,</text><text x="298" y="835" class="d">in-memory session</text><polyline points="254,816.0 280,816.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="498" y="766" width="196" height="100" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="512" y="793" class="t" fill="#4c1d95">Gemini 3.5</text><text x="512" y="816" class="d">Flash-Lite, structured</text><text x="512" y="835" class="d">JSON output</text><polyline points="480,816.0 494,816.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="712" y="766" width="196" height="100" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="726" y="793" class="t" fill="#7c2d12">Number check</text><text x="726" y="816" class="d">no new figures,</text><text x="726" y="835" class="d">no diagnosis</text><polyline points="694,816.0 708,816.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="64" y="886" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="913" class="t" fill="#0f172a">General chat</text><text x="78" y="936" class="d">non-clinical</text><rect x="284" y="886" width="196" height="100" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="298" y="913" class="t" fill="#4c1d95">Gemini 3.5</text><text x="298" y="936" class="d">Flash-Lite, structured</text><text x="298" y="955" class="d">JSON output</text><polyline points="254,936.0 280,936.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="498" y="886" width="196" height="100" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="512" y="913" class="t" fill="#7c2d12">Contract check</text><text x="512" y="936" class="d">no citations,</text><text x="512" y="955" class="d">refusal → crisis reply</text><polyline points="480,936.0 494,936.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="64" y="1006" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="1033" class="t" fill="#0f172a">Fixed replies</text><text x="78" y="1056" class="d">clarify, questionnaire</text><text x="78" y="1075" class="d">redirect, unsupported,</text><text x="78" y="1094" class="d">safety</text><rect x="284" y="1006" width="196" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="298" y="1033" class="t" fill="#0f172a">Fixed text</text><text x="298" y="1056" class="d">&#x27;Did you mean…?&#x27; with</text><text x="298" y="1075" class="d">server-verified Yes</text><polyline points="254,1056.0 280,1056.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="498" y="1006" width="196" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="512" y="1033" class="t" fill="#312e81">Cached</text><text x="512" y="1056" class="d">by message hash</text><polyline points="480,1056.0 494,1056.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="64" y="646" width="190" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="78" y="673" class="t" fill="#0f172a">Questionnaire</text><text x="78" y="696" class="d">POST /v1/assessments</text><rect x="284" y="646" width="196" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="298" y="673" class="t" fill="#0f172a">Assessment graph</text><text x="298" y="696" class="d">LangGraph: authorize,</text><text x="298" y="715" class="d">validate 85 answers</text><polyline points="254,696.0 280,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="498" y="646" width="196" height="100" rx="12" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/><text x="512" y="673" class="t" fill="#14532d">DCMFNet × 2</text><text x="512" y="696" class="d">PyTorch, 105 features</text><text x="512" y="715" class="d">11 modalities, pos + neg</text><polyline points="480,696.0 494,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="712" y="646" width="196" height="100" rx="12" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/><text x="726" y="673" class="t" fill="#14532d">Reference levels</text><text x="726" y="696" class="d">percentile vs 20k</text><text x="726" y="715" class="d">synthetic profiles</text><polyline points="694,696.0 708,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="926" y="646" width="196" height="100" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="940" y="673" class="t" fill="#4c1d95">Gemini 3.5</text><text x="940" y="696" class="d">Flash-Lite, async</text><text x="940" y="715" class="d">explanation</text><polyline points="908,696.0 922,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1140" y="646" width="196" height="100" rx="12" fill="#fff4e5" stroke="#d97706" stroke-width="2"/><text x="1154" y="673" class="t" fill="#7c2d12">Number check</text><text x="1154" y="696" class="d">exact scores and</text><text x="1154" y="715" class="d">percentiles only</text><polyline points="1122,696.0 1136,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1354" y="646" width="196" height="100" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/><text x="1368" y="673" class="t" fill="#1e3a8a">Result in chat</text><text x="1368" y="696" class="d">polled via /latest,</text><text x="1368" y="715" class="d">levels + follow-ups</text><polyline points="1336,696.0 1350,696.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="1760" y="760" width="200" height="140" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/><text x="1774" y="787" class="t" fill="#1e3a8a">Validated SSE</text><text x="1774" y="810" class="d">validated_content,</text><text x="1774" y="829" class="d">evidence, done</text><text x="1774" y="848" class="d">→ chat UI</text><polyline points="1550,576.0 1745,576.0 1745,830 1756,830" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="908,816.0 1745,816.0 1745,830 1756,830" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="694,936.0 1745,936.0 1745,830 1756,830" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="694,1056.0 1745,1056.0 1745,830 1756,830" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><polyline points="1810,446 1810,470 1700,470 1700,496" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#head)"/><rect x="40" y="1160" width="1920" height="72" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="54" y="1187" class="t" fill="#1e293b">Monitoring (aggregates only, no message text)</text><text x="54" y="1210" class="d">live LLM judge Gemini 3.5 Flash (groundedness, correctness) · input drift z-score + per-question Monte Carlo tests (BH-FDR) · OOD: surprise + Mahalanobis · routing, guardrail and latency counters</text><rect x="40" y="1250" width="1920" height="52" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="1000.0" y="1284.0" class="b" text-anchor="middle">The LLM never calculates risk, changes model outputs or invents citations.</text></svg>