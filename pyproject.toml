[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-risk-agent"
version = "0.1.0"
description = "Research-only Clinical Risk AI Agent"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
rag = [
  "qdrant-client>=1.16,<2",
  "transformers>=4.44,<5",
  "safetensors>=0.4",
  "pypdf>=6,<7",
]
rag-benchmark = [
  "bert-score==0.3.13",
]
mcp = [
  "mcp>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
